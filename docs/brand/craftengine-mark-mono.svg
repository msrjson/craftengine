<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CraftEngine">
  <title>CraftEngine</title>
  <!--
    Single-colour mark for places that cannot carry the two-tone version:
    favicons at small sizes, embroidery, stamps, a README badge, anything
    printed in one ink.

    `currentColor` means the mark inherits the surrounding text colour when the
    file is inlined, so one file serves light and dark backgrounds. A gap is
    cut around the bolt so it stays legible when gear and bolt share a colour.
  -->
  <g fill="currentColor">
    <path d="M32 9a23 23 0 0 0-23 23 23 23 0 0 0 23 23v-8a15 15 0 0 1-15-15 15 15 0 0 1 15-15z"/>
    <rect x="28.5" y="2" width="7" height="10" rx="1.5" transform="rotate(200 32 32)"/>
    <rect x="28.5" y="2" width="7" height="10" rx="1.5" transform="rotate(245 32 32)"/>
    <rect x="28.5" y="2" width="7" height="10" rx="1.5" transform="rotate(290 32 32)"/>
    <rect x="28.5" y="2" width="7" height="10" rx="1.5" transform="rotate(335 32 32)"/>
    <path d="M38 12 L24 34 L33 34 L31 54 L48 29 L38 29 Z" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"/>
  </g>
</svg>
