[build-system]
# 77+ is required for PEP 639 metadata (`license` as an SPDX string plus
# `license-files`). Older setuptools rejects it.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "craft"
version = "3.23.0"
description = "A batteries-included Python web framework built on Starlette"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Santos", email = "snarthost@gmail.com" }]
maintainers = [{ name = "Antonio Santos", email = "snarthost@gmail.com" }]
keywords = [
    "framework",
    "web",
    "mvc",
    "orm",
    "starlette",
    "asgi",
    "active-record",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.104.0",
    "starlette>=0.27.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1",
    "typer>=0.9",
    # Renders the Markdown documentation. It arrived transitively through
    # typer -> rich; depending on that was luck, not a decision.
    "markdown-it-py>=3.0",
    # Starlette needs this to parse multipart/form-data.
    "python-multipart>=0.0.6",
    # passlib's bcrypt backend reads `bcrypt.__about__`, which 4.1 removed. Pin
    # below it, or passlib raises on first use and Hash falls back to PBKDF2.
    "passlib>=1.7",
    "bcrypt>=4.0,<4.1",
    # The default password hash (Slice 2 of the SoftPax upstream roadmap):
    # memory-hard, GPU/ASIC-resistant, and the OWASP-recommended choice over
    # bcrypt for new hashes. bcrypt/PBKDF2 verification is kept for existing
    # hashes - see `engine/auth/password.py`.
    "argon2-cffi>=23.1",
    # AES-GCM for the credential vault (`engine/security/vault.py`). A
    # maintained, audited library - never a hand-rolled cipher.
    "cryptography>=42.0",
    "faker>=20.0",
    "psycopg2-binary>=2.9",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "jsonschema>=4.18",
]
# `dev msr:validate` checks the MSR JSON manifest against the canonical schema.
msr = ["jsonschema>=4.18"]
mysql = ["pymysql>=1.2.0"]
redis = ["redis>=5.0"]
# The Gemini and OpenAI drivers call an HTTP API. The `mock` driver needs
# nothing, so this is optional like every other backend.
ai = ["httpx>=0.25"]

[project.scripts]
dev = "engine.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.setuptools.package-data]
# Markdown definitions installed by `dev.py agent:install`.
"engine.cli.agent_catalog" = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
# Starting scope: the framework package only. `app/` (the sample application)
# and `tests/` are intentionally excluded for now — turning on lint here
# should not become a blocking rewrite of the whole codebase in one pass.
include = ["engine/**/*.py"]

[tool.ruff.lint]
# Deliberately small starting ruleset: undefined names, unused imports, and
# bare-except style issues catch real bugs without requiring a full-codebase
# style pass. Widen this incrementally as violations are cleared out.
select = ["E9", "F", "B"]
ignore = ["F401"]
