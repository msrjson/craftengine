name: Craft Engine CI/CD Production Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-sqlite:
    name: Pytest (SQLite) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        working-directory: data
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: data
        run: |
          ruff check .

      # Two passes: views are `*.forge.py`, a template DSL carrying a `.py`
      # suffix, so one config cannot classify both without failing every view.
      # Blocking, no bypass label — see the standard's §12.4.
      - name: Language standard
        working-directory: data
        run: |
          python tools/lint_language.py --config language-standard.toml --format github
          python tools/lint_language.py --config language-standard.views.toml --format github

      - name: Run Pytest Suite (SQLite, with coverage)
        working-directory: data
        run: |
          python -m pytest --cov=engine --cov-report=term-missing

  test-postgres:
    name: Pytest (PostgreSQL) — Python 3.14
    runs-on: ubuntu-latest

    services:
      postgres:
        # Match what docker-compose.yml provisions. On an older server the
        # version-gated tests skip rather than fail, so a mismatch here is
        # silent: CI would report green while never exercising `uuidv7()`.
        image: postgres:18
        env:
          POSTGRES_USER: craft
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: craft_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U craft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        working-directory: data
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite (PostgreSQL, with coverage)
        working-directory: data
        env:
          CRAFT_TEST_DB: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: craft_validation
          DB_USERNAME: craft
          DB_PASSWORD: secretpassword
        run: |
          python -m pytest --cov=engine --cov-report=term-missing

  docs:
    name: Publish Documentation to GitHub Pages
    needs: [test-sqlite, test-postgres]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    # One deployment at a time, and let a newer one win: two pushes in quick
    # succession would otherwise race to publish, and the loser could be the
    # newer commit.
    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        working-directory: data
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      # Separate from the build so a dead cross-reference is reported as
      # exactly that, rather than as "the docs build failed".
      - name: Check documentation links
        working-directory: data
        run: python dev.py docs:check

      # The canonical URL points at craftengine.org even here: this Pages copy
      # is a mirror, and two indexed copies of the same guide compete.
      - name: Build the documentation site
        working-directory: data
        run: python dev.py docs:build --output public/docs --base-url https://craftengine.org/docs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data/public/docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  docker-build:
    name: Build Production Docker Image
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./data
          file: ./data/Dockerfile.prod
          push: false
          tags: craft-engine:latest

  release:
    name: Automated GitHub Release & Tag
    needs: [test-sqlite, test-postgres, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Tag
        id: get_version
        run: |
          # The documented scheme is vX.Y.Z-rNNNNN (CONTRIBUTING.md), and the
          # counter lives in engine/__init__.py while the version lives in
          # pyproject.toml. This step used to read only the version, so it cut
          # v3.12.0 and v3.13.0 with no counter at all — the automation and the
          # policy disagreed, and the automation won silently.
          VERSION=$(grep -m1 '^version =' data/pyproject.toml | cut -d'"' -f2)
          RELEASE=$(grep -m1 '^__release__' data/engine/__init__.py | cut -d'"' -f2)
          INIT_VERSION=$(grep -m1 '^__version__' data/engine/__init__.py | cut -d'"' -f2)

          # Both files declare the version and must agree. A mismatch is a
          # silent bug: whichever file is read tells you something different.
          if [ "$VERSION" != "$INIT_VERSION" ]; then
            echo "::error::pyproject.toml says ${VERSION} but engine/__init__.py says ${INIT_VERSION}"
            exit 1
          fi

          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${RELEASE}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Craft Engine ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
